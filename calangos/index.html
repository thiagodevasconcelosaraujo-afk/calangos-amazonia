<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Sobrevivendo à Amazônia: O Desafio dos Calangos</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body,#root{margin:0;height:100%;overflow:hidden;background:#07120b;color:#eaf5e4;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px);pointer-events:none}
.ui>*{pointer-events:auto}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;font-size:13px;pointer-events:none}
.pill{background:#000a;padding:6px 10px;border-radius:20px}
.modal{position:fixed;inset:0;z-index:20;background:#000d;overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 10px 20px}
.panel{background:#0b1d12ee;border:1px solid #3f7a4f;border-radius:14px;padding:14px;max-width:640px;margin:0 auto;width:100%;max-height:46vh;overflow:auto}
.btn{display:block;width:100%;margin:6px 0;padding:14px 12px;min-height:52px;border-radius:10px;border:1px solid #5fae72;background:#14331f;color:#eaf5e4;font-size:15px;text-align:left;cursor:pointer}
.btn:hover,.btn:active{background:#1f5030}.btn.main{background:#2c8a4a;text-align:center;font-weight:700}
.fail{border-color:#e0583c}.fail h2{color:#ff7a5c;margin:0 0 6px}
.center{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + 14vh);pointer-events:none}
.qte{pointer-events:auto;width:132px;height:132px;touch-action:manipulation;border-radius:50%;border:6px solid #ffd54a;background:#0008;color:#fff;font-size:20px;font-weight:800;animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(1.15)}}
.row{display:flex;gap:8px}.row .btn{text-align:center}
.end{font-size:clamp(18px,4vw,28px);font-weight:700;line-height:1.35;text-align:center;margin:8px 0}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
